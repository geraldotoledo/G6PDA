name: Build, Audit, Deploy Pages & Compile Android Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # -----------------------------------------------------------
  # 1. AUDITORIA + TESTES + DEPLOY GITHUB PAGES (PWA)
  # -----------------------------------------------------------
  deploy-pages:
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Auditoria Estrutural da Base
        run: npm run audit

      - name: Executar Suíte de Testes Automatizados
        run: npm test

      - name: Compilar PWA de Produção (Vite)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -----------------------------------------------------------
  # 2. COMPILAÇÃO E ASSINATURA DO APP ANDROID (APK / AAB RELEASE)
  # -----------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar e Decodificar Keystore de Assinatura (CI Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Segredos de assinatura Android ausentes (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Configure-os em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"
          keytool -list -keystore "$RUNNER_TEMP/release-keystore.p12" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Instalar Dependências, Compilar Web e Sincronizar Capacitor Android
        run: |
          npm install
          npm run build
          npm install --save-dev @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap add android
          npx cap sync android

      - name: Aplicar Ícones do Aplicativo Android
        run: cp -R resources/android/res/. android/app/src/main/res/

      - name: Compilar APK e AAB Release no Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Alinhar, Assinar e Verificar APK e AAB de Produção
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/G6PDApp-release-signed.apk"

          test -f "$UNSIGNED_APK"
          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release-keystore.p12" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

          UNSIGNED_AAB="android/app/build/outputs/bundle/release/app-release.aab"
          SIGNED_AAB="android/app/build/outputs/bundle/release/G6PDApp-release-signed.aab"
          test -f "$UNSIGNED_AAB"
          cp "$UNSIGNED_AAB" "$SIGNED_AAB"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release-keystore.p12" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$SIGNED_AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$SIGNED_AAB"

      - name: Limpar Keystore Temporário
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.p12"

      - name: Publicar Artefato APK Assinado (Pronto para Instalar)
        uses: actions/upload-artifact@v4
        with:
          name: G6PDApp-Android-APK
          path: android/app/build/outputs/apk/release/G6PDApp-release-signed.apk
          if-no-files-found: error

      - name: Publicar Artefato AAB Assinado (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: G6PDApp-Android-AAB
          path: android/app/build/outputs/bundle/release/G6PDApp-release-signed.aab
          if-no-files-found: error
